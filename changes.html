<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Changes | Pro-Man</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-gray-50 h-screen flex flex-col overflow-hidden">
    
    <div id="main-header"></div>

    <div class="flex flex-1 overflow-hidden">
        
        <aside class="w-1/3 border-r border-gray-200 bg-white flex flex-col shadow-inner">
            <div class="p-4 border-b border-gray-100 bg-gray-50/50 flex justify-between items-center">
                <div>
                    <h2 class="font-black text-gray-900 text-sm uppercase tracking-tighter">Change Control Log</h2>
                    <p class="text-[10px] text-gray-500 font-medium">Manage formal project variances</p>
                </div>
                <div class="flex items-center space-x-2">
                    <select id="cr-group-by" onchange="loadCRList()" class="text-[10px] font-bold border-gray-200 rounded bg-white px-2 py-1 outline-none focus:ring-1 focus:ring-indigo-500">
                        <option value="none">Sort: Newest</option>
                        <option value="requirement">Group: Requirement</option>
                    </select>
                </div>
            </div>

            <div id="cr-list" class="flex-1 overflow-y-auto p-4 space-y-3 bg-gray-50/30 no-scrollbar">
                <div class="animate-pulse space-y-3">
                    <div class="h-24 bg-gray-100 rounded-xl"></div>
                    <div class="h-24 bg-gray-100 rounded-xl"></div>
                </div>
            </div>
        </aside>

        <main class="flex-1 bg-white overflow-y-auto relative no-scrollbar">
            
            <div id="cr-form-container" class="max-w-4xl mx-auto p-10 hidden">
                <div class="flex justify-between items-start mb-10 pb-6 border-b border-gray-100">
                    <div>
                        <div class="flex items-center space-x-2">
                            <span id="display-cr-id" class="px-2 py-0.5 bg-indigo-50 text-indigo-600 rounded text-[10px] font-black uppercase tracking-widest">CR-XXX</span>
                            <span id="display-cr-status" class="px-2 py-0.5 bg-yellow-50 text-yellow-600 rounded text-[10px] font-black uppercase tracking-widest">PENDING</span>
                        </div>
                        <h1 id="display-cr-title" class="text-3xl font-black text-gray-900 mt-2 tracking-tight">Requirement Variance</h1>
                        <p class="text-sm text-gray-500 mt-1 font-medium">Assigned to: <span id="display-cr-accountable" class="text-gray-900 font-bold">---</span></p>
                    </div>
                    
                    <div class="flex items-center space-x-3">
                        <button onclick="exportToPDF()" class="p-2.5 text-gray-400 hover:text-indigo-600 hover:bg-indigo-50 border border-gray-100 rounded-xl transition shadow-sm" title="Export PDF">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                        </button>
                        <button onclick="saveCRChanges()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-8 py-2.5 rounded-xl font-bold text-sm shadow-lg shadow-indigo-200 transition">
                            Save Changes
                        </button>
                    </div>
                </div>

                <form id="cr-detail-form" class="space-y-8">
                    <input type="hidden" id="current-cr-uuid">
                    
                    <div class="grid grid-cols-3 gap-8">
                        <div>
                            <label class="block text-[10px] font-black text-gray-400 uppercase tracking-widest mb-2">Change Type</label>
                            <input type="text" id="cr-type" class="w-full border-b border-gray-200 py-2 text-sm font-bold text-gray-800 focus:border-indigo-500 outline-none transition">
                        </div>
                        <div>
                            <label class="block text-[10px] font-black text-gray-400 uppercase tracking-widest mb-2">Requested Hours</label>
                            <input type="number" id="cr-hours" class="w-full border-b border-gray-200 py-2 text-sm font-bold text-gray-800 focus:border-indigo-500 outline-none transition">
                        </div>
                        <div>
                            <label class="block text-[10px] font-black text-gray-400 uppercase tracking-widest mb-2">Total Cost Impact</label>
                            <input type="text" id="cr-cost" class="w-full border-b border-gray-200 py-2 text-sm font-bold text-indigo-600 focus:border-indigo-500 outline-none transition">
                        </div>
                    </div>

                    <div class="space-y-6">
                        <div>
                            <label class="block text-[10px] font-black text-gray-400 uppercase tracking-widest mb-2">Reason for Change</label>
                            <textarea id="cr-reason" rows="3" class="w-full bg-gray-50 border-none rounded-2xl p-4 text-sm font-medium text-gray-700 focus:ring-2 focus:ring-indigo-500 outline-none transition"></textarea>
                        </div>
                        <div>
                            <label class="block text-[10px] font-black text-gray-400 uppercase tracking-widest mb-2">Impact Analysis & Proposed Solution</label>
                            <textarea id="cr-impact" rows="6" class="w-full bg-gray-50 border-none rounded-2xl p-4 text-sm font-medium text-gray-700 focus:ring-2 focus:ring-indigo-500 outline-none transition" placeholder="How does this affect the critical path?"></textarea>
                        </div>
                    </div>
                </form>
            </div>

            <div id="cr-empty-state" class="absolute inset-0 flex flex-col items-center justify-center text-gray-300">
                <div class="w-20 h-20 bg-gray-50 rounded-full flex items-center justify-center mb-4">
                    <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </div>
                <p class="text-sm font-bold uppercase tracking-widest text-gray-400">Select a Change Request to View</p>
                <p class="text-xs mt-1">Audit trail entries appear on the left.</p>
            </div>
        </main>
    </div>

    <script type="module">
        import { renderProjectHeader } from './js/components.js';
        import { supabase } from './js/config.js';
        import { checkAccess } from './js/auth.js';

        let currentProjectId = localStorage.getItem('selected_project_id');

        document.addEventListener('DOMContentLoaded', async () => {
            const session = await checkAccess();
            const projectName = localStorage.getItem('selected_project_name');
            renderProjectHeader(session, 'changes', projectName);
            loadCRList();
        });

        /**
         * Loads the list of Change Requests
         */
        window.loadCRList = async () => {
            const groupBy = document.getElementById('cr-group-by').value;
            
            const { data: changes, error } = await supabase
                .from('change_items')
                .select(`
                    *,
                    user_profiles:change_accountable(full_name),
                    requirements(title)
                `)
                .eq('project_id', currentProjectId)
                .order('created_at', { ascending: false });

            if (error) return console.error(error);

            const container = document.getElementById('cr-list');
            
            if (groupBy === 'requirement') {
                const grouped = changes.reduce((acc, cr) => {
                    const key = cr.requirements?.title || 'Unassigned';
                    if (!acc[key]) acc[key] = [];
                    acc[key].push(cr);
                    return acc;
                }, {});

                container.innerHTML = Object.entries(grouped).map(([req, items]) => `
                    <div class="mb-6">
                        <div class="text-[10px] font-black text-gray-400 uppercase tracking-widest px-2 mb-2">${req}</div>
                        <div class="space-y-2">
                            ${items.map(cr => renderCRCard(cr)).join('')}
                        </div>
                    </div>
                `).join('');
            } else {
                container.innerHTML = changes.map(cr => renderCRCard(cr)).join('');
            }
        };

        function renderCRCard(cr) {
            const statusColor = cr.change_status === 'Approved' ? 'bg-green-100 text-green-700' : 
                               cr.change_status === 'Pending' ? 'bg-yellow-100 text-yellow-700' : 'bg-gray-100 text-gray-700';
            
            return `
                <div onclick="loadCRDetail('${cr.change_id}')" 
                     class="p-4 bg-white border border-gray-200 rounded-xl hover:border-indigo-500 hover:shadow-md cursor-pointer transition-all duration-200 group">
                    <div class="flex justify-between items-start mb-2">
                        <span class="text-[10px] font-black text-indigo-600 uppercase tracking-widest">CR-${cr.change_number || 'NEW'}</span>
                        <span class="text-[8px] font-black px-1.5 py-0.5 rounded ${statusColor} uppercase">${cr.change_status || 'Draft'}</span>
                    </div>
                    <h3 class="text-xs font-black text-gray-900 group-hover:text-indigo-600 transition truncate">${cr.title}</h3>
                    <div class="mt-4 flex justify-between items-center text-[9px] font-bold text-gray-400 uppercase tracking-tighter">
                        <span>${cr.user_profiles?.full_name || 'System'}</span>
                        <span>${new Date(cr.created_at).toLocaleDateString()}</span>
                    </div>
                </div>
            `;
        }

        /**
         * Loads specific details into the form
         */
        window.loadCRDetail = async (id) => {
            const { data: cr, error } = await supabase
                .from('change_items')
                .select('*, user_profiles:change_accountable(full_name)')
                .eq('change_id', id)
                .single();

            if (error) return;

            document.getElementById('cr-empty-state').classList.add('hidden');
            document.getElementById('cr-form-container').classList.remove('hidden');

            // Set UI labels
            document.getElementById('display-cr-id').innerText = `CR-${cr.change_number}`;
            document.getElementById('display-cr-status').innerText = cr.change_status;
            document.getElementById('display-cr-title').innerText = cr.title;
            document.getElementById('display-cr-accountable').innerText = cr.user_profiles?.full_name || 'System';

            // Set Form Values
            document.getElementById('current-cr-uuid').value = cr.change_id;
            document.getElementById('cr-type').value = cr.change_type || '';
            document.getElementById('cr-hours').value = cr.requested_hours || 0;
            document.getElementById('cr-cost').value = `$${parseFloat(cr.total_cost_rollup).toLocaleString()}`;
            document.getElementById('cr-reason').value = cr.change_reason || '';
            document.getElementById('cr-impact').value = cr.impact_analysis || '';
        };

        /**
         * Saves updates to the Change Item
         */
        window.saveCRChanges = async () => {
            const id = document.getElementById('current-cr-uuid').value;
            const updates = {
                change_type: document.getElementById('cr-type').value,
                requested_hours: parseFloat(document.getElementById('cr-hours').value),
                change_reason: document.getElementById('cr-reason').value,
                impact_analysis: document.getElementById('cr-impact').value,
                updated_at: new Date().toISOString()
            };

            const { error } = await supabase
                .from('change_items')
                .update(updates)
                .eq('change_id', id);

            if (error) alert("Save failed: " + error.message);
            else {
                alert("Change Request Updated.");
                loadCRList();
            }
        };

        /**
         * PDF Export Placeholder
         */
        window.exportToPDF = () => {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            const title = document.getElementById('display-cr-title').innerText;
            const crId = document.getElementById('display-cr-id').innerText;
            
            doc.setFontSize(20);
            doc.text("Governance Change Request", 20, 20);
            doc.setFontSize(12);
            doc.text(`${crId}: ${title}`, 20, 30);
            doc.text(`Accountable: ${document.getElementById('display-cr-accountable').innerText}`, 20, 40);
            doc.text(`Impact: ${document.getElementById('cr-impact').value}`, 20, 50);
            
            doc.save(`${crId}_Export.pdf`);
        };
    </script>
</body>
</html>
