<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Changes | Pro-Man</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-gray-50 h-screen flex flex-col overflow-hidden">
    
    <div id="main-header"></div>

    <div class="flex flex-1 overflow-hidden">
        
        <aside class="w-1/3 border-r border-gray-200 bg-white flex flex-col shadow-inner">
            <div class="p-4 border-b border-gray-100 bg-gray-50/50 flex justify-between items-center">
                <div>
                    <h2 class="font-black text-gray-900 text-sm uppercase tracking-tighter">Change Control Log</h2>
                    <p class="text-[10px] text-gray-500 font-medium">Manage formal project variances</p>
                </div>
                <div class="flex items-center space-x-2">
                    <button onclick="createNewManualCR()" class="p-1.5 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 transition shadow-sm" title="New Change Request">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M12 4v16m8-8H4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
                    </button>
                    <select id="cr-group-by" onchange="loadCRList()" class="text-[10px] font-bold border-gray-200 rounded bg-white px-2 py-1 outline-none">
                        <option value="none">Sort: Newest</option>
                        <option value="requirement">Group: Requirement</option>
                    </select>
                </div>
            </div>

            <div id="cr-list" class="flex-1 overflow-y-auto p-4 space-y-3 bg-gray-50/30 no-scrollbar">
                </div>
        </aside>

        <main class="flex-1 bg-white overflow-y-auto relative no-scrollbar">
            
            <div id="cr-form-container" class="max-w-4xl mx-auto p-10 hidden">
                <div class="flex justify-between items-start mb-10 pb-6 border-b border-gray-100">
                    <div>
                        <div class="flex items-center space-x-2">
                            <span id="display-cr-id" class="px-2 py-0.5 bg-indigo-50 text-indigo-600 rounded text-[10px] font-black tracking-widest uppercase">CR-XXX</span>
                            <select id="cr-status-select" class="px-2 py-0.5 border-none bg-yellow-50 text-yellow-600 rounded text-[10px] font-black uppercase tracking-widest cursor-pointer focus:ring-1 focus:ring-yellow-400">
                                <option value="Pending">Pending</option>
                                <option value="Approved">Approved</option>
                                <option value="Rejected">Rejected</option>
                                <option value="Draft">Draft</option>
                            </select>
                        </div>
                        <h1 id="display-cr-title" class="text-3xl font-black text-gray-900 mt-2 tracking-tight line-clamp-1">Requirement Variance</h1>
                        <p class="text-sm text-gray-500 mt-1 font-medium">Accountable: <span id="display-cr-accountable" class="text-gray-900 font-bold">---</span></p>
                    </div>
                    
                    <div class="flex items-center space-x-3">
                        <button onclick="exportToPDF()" class="p-2.5 text-gray-400 hover:text-indigo-600 hover:bg-indigo-50 border border-gray-100 rounded-xl transition shadow-sm" title="Export PDF">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                        </button>
                        <button onclick="saveCRChanges()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-8 py-2.5 rounded-xl font-bold text-sm shadow-lg shadow-indigo-200 transition">
                            Save & Process Status
                        </button>
                    </div>
                </div>

                <form id="cr-detail-form" class="space-y-8">
                    <input type="hidden" id="current-cr-uuid">
                    
                    <div class="grid grid-cols-3 gap-8">
                        <div>
                            <label class="block text-[10px] font-black text-gray-400 uppercase tracking-widest mb-2">Change Type</label>
                            <input type="text" id="cr-type" class="w-full border-b border-gray-200 py-2 text-sm font-bold text-gray-800 focus:border-indigo-500 outline-none">
                        </div>
                        <div>
                            <label class="block text-[10px] font-black text-gray-400 uppercase tracking-widest mb-2">Requested Hours</label>
                            <input type="number" id="cr-hours" class="w-full border-b border-gray-200 py-2 text-sm font-bold text-gray-800 focus:border-indigo-500 outline-none">
                        </div>
                        <div>
                            <label class="block text-[10px] font-black text-gray-400 uppercase tracking-widest mb-2">Total Cost Impact</label>
                            <input type="text" id="cr-cost" class="w-full border-b border-gray-200 py-2 text-sm font-bold text-indigo-600 focus:border-indigo-500 outline-none">
                        </div>
                    </div>

                    <div class="space-y-6">
                        <div>
                            <label class="block text-[10px] font-black text-gray-400 uppercase tracking-widest mb-2">Reason for Change</label>
                            <textarea id="cr-reason" rows="3" class="w-full bg-gray-50 border-none rounded-2xl p-4 text-sm font-medium text-gray-700 focus:ring-2 focus:ring-indigo-500 outline-none"></textarea>
                        </div>
                        <div>
                            <label class="block text-[10px] font-black text-gray-400 uppercase tracking-widest mb-2">Impact Analysis & Proposed Solution</label>
                            <textarea id="cr-impact" rows="6" class="w-full bg-gray-50 border-none rounded-2xl p-4 text-sm font-medium text-gray-700 focus:ring-2 focus:ring-indigo-500 outline-none"></textarea>
                        </div>
                    </div>
                </form>
            </div>

            <div id="cr-empty-state" class="absolute inset-0 flex flex-col items-center justify-center text-gray-300">
                <p class="text-sm font-bold uppercase tracking-widest text-gray-400">Select a Change Request to View</p>
            </div>
        </main>
    </div>

    <script type="module">
    import { renderProjectHeader } from './js/components.js';
    import { supabase } from './js/config.js';
    import { checkAccess } from './js/auth.js';

    // 1. GLOBAL STATE
    const urlParams = new URLSearchParams(window.location.search);
    let currentProjectId = urlParams.get('id') || localStorage.getItem('selected_project_id');

    // 2. INITIALIZATION
    document.addEventListener('DOMContentLoaded', async () => {
        const session = await checkAccess();
        window.sessionData = session;

        if (!currentProjectId || currentProjectId === "undefined") {
            console.error("No Project ID found. Redirecting...");
            window.location.href = 'index.html';
            return;
        }

        const projectName = localStorage.getItem('selected_project_name') || "Project Details";
        renderProjectHeader(session, 'changes', projectName);

        await loadCRList();
    });

    // 3. CORE LOGIC FUNCTIONS
    window.loadCRList = async () => {
        const groupByElement = document.getElementById('cr-group-by');
        const groupBy = groupByElement ? groupByElement.value : 'none';

        // FIXED: Added !requirement_id to disambiguate the join
        const { data: changes, error } = await supabase
            .from('change_items')
            .select('*, user_profiles:change_accountable(full_name), requirements!requirement_id(title)')
            .eq('project_id', currentProjectId)
            .order('created_at', { ascending: false });

        const container = document.getElementById('cr-list');
        if (!container) return;

        if (error) {
            console.error("Fetch Error:", error.message);
            container.innerHTML = `<p class="text-xs text-red-500 text-center mt-10">Error loading records.</p>`;
            return;
        }

        if (!changes || changes.length === 0) {
            container.innerHTML = `<p class="text-[10px] text-center text-gray-400 font-bold uppercase mt-10">No records found</p>`;
            return;
        }

        if (groupBy === 'requirement') {
            const grouped = changes.reduce((acc, cr) => {
                const key = cr.requirements?.title || 'General/Unassigned';
                if (!acc[key]) acc[key] = [];
                acc[key].push(cr);
                return acc;
            }, {});

            container.innerHTML = Object.entries(grouped).map(([req, items]) => `
                <div class="mb-6">
                    <div class="text-[10px] font-black text-gray-400 px-2 mb-2 uppercase">${req}</div>
                    ${items.map(cr => renderCRCard(cr)).join('')}
                </div>
            `).join('');
        } else {
            container.innerHTML = changes.map(cr => renderCRCard(cr)).join('');
        }
    };

    function renderCRCard(cr) {
        let statusColor = 'bg-yellow-100 text-yellow-700';
        if (cr.change_status === 'Approved') statusColor = 'bg-green-100 text-green-700';
        if (cr.change_status === 'Rejected') statusColor = 'bg-red-100 text-red-700';

        return `
            <div onclick="loadCRDetail('${cr.change_id}')" class="p-4 mb-2 bg-white border border-gray-200 rounded-xl hover:border-indigo-500 cursor-pointer shadow-sm group transition-all">
                <div class="flex justify-between items-start mb-2">
                    <span class="text-[10px] font-black text-indigo-600 uppercase">CR-${cr.change_number || 'X'}</span>
                    <span class="text-[8px] font-black px-1.5 py-0.5 rounded ${statusColor} uppercase">${cr.change_status || 'Draft'}</span>
                </div>
                <h3 class="text-xs font-black text-gray-900 truncate">${cr.title}</h3>
            </div>`;
    }

    window.loadCRDetail = async (id) => {
        // FIXED: Added !requirement_id to disambiguate the join
        const { data: cr } = await supabase
            .from('change_items')
            .select('*, user_profiles:change_accountable(full_name), requirements!requirement_id(title)')
            .eq('change_id', id)
            .single();

        if (!cr) return;

        document.getElementById('cr-empty-state')?.classList.add('hidden');
        document.getElementById('cr-form-container')?.classList.remove('hidden');
        
        document.getElementById('display-cr-id').innerText = `CR-${cr.change_number}`;
        document.getElementById('cr-status-select').value = cr.change_status || 'Pending';
        document.getElementById('display-cr-title').innerText = cr.title;
        document.getElementById('display-cr-accountable').innerText = cr.user_profiles?.full_name || 'System';
        document.getElementById('current-cr-uuid').value = cr.change_id;
        document.getElementById('cr-type').value = cr.change_type || '';
        document.getElementById('cr-hours').value = cr.requested_hours || 0;
        document.getElementById('cr-cost').value = cr.total_cost_rollup || 0;
        document.getElementById('cr-reason').value = cr.change_reason || '';
        document.getElementById('cr-impact').value = cr.impact_analysis || '';
    };

    window.saveCRChanges = async () => {
        const id = document.getElementById('current-cr-uuid').value;
        const status = document.getElementById('cr-status-select').value;
        
        const updates = {
            change_type: document.getElementById('cr-type').value,
            requested_hours: parseFloat(document.getElementById('cr-hours').value) || 0,
            change_reason: document.getElementById('cr-reason').value,
            impact_analysis: document.getElementById('cr-impact').value,
            change_status: status,
            updated_at: new Date().toISOString()
        };

        if (status === 'Approved') {
            updates.approved_at = new Date().toISOString();
            updates.approved_by = window.sessionData?.full_name || 'Authorized Admin';
        }

        const { error } = await supabase.from('change_items').update(updates).eq('change_id', id);
        if (error) {
            alert(error.message);
        } else {
            alert("CR Updated & Governance Engine Notified.");
            loadCRList();
        }
    };

    window.createNewManualCR = async () => {
        const title = prompt("Enter a Title for this Change Request:");
        if (!title) return;

        try {
            const { data: latest } = await supabase
                .from('change_items')
                .select('change_number')
                .eq('project_id', currentProjectId)
                .order('change_number', { ascending: false })
                .limit(1)
                .single();

            const newNumber = (latest?.change_number || 0) + 1;

            const { data: newCR, error } = await supabase
                .from('change_items')
                .insert([{
                    project_id: currentProjectId,
                    title: title,
                    change_number: newNumber,
                    change_status: 'Draft',
                    change_type: 'Manual Entry',
                    change_accountable: window.sessionData?.user_id || (await supabase.auth.getUser()).data.user?.id,
                    created_at: new Date().toISOString()
                }])
                .select()
                .single();

            if (error) throw error;

            await loadCRList();
            loadCRDetail(newCR.change_id);
            alert(`CR-${newNumber} Initialized.`);
            
        } catch (err) {
            console.error("Initiation Error:", err.message);
            alert("Critical: Could not save new Change Log item.");
        }
    };

    window.exportToPDF = () => {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        const crId = document.getElementById('display-cr-id').innerText;
        
        doc.setFillColor(79, 70, 229); 
        doc.rect(0, 0, 210, 40, 'F');
        doc.setTextColor(255, 255, 255);
        doc.setFontSize(22);
        doc.text("CHANGE CONTROL DOCUMENT", 20, 25);
        
        doc.setTextColor(0, 0, 0);
        doc.setFontSize(10);
        doc.text(`REFERENCE: ${crId}`, 20, 50);
        doc.text(`STATUS: ${document.getElementById('cr-status-select').value.toUpperCase()}`, 20, 55);
        doc.text(`DATE: ${new Date().toLocaleDateString()}`, 20, 60);
        doc.text(`ACCOUNTABLE: ${document.getElementById('display-cr-accountable').innerText}`, 20, 65);
        
        doc.setDrawColor(200, 200, 200);
        doc.line(20, 75, 190, 75);
        
        doc.setFontSize(14);
        doc.text("TITLE", 20, 85);
        doc.setFontSize(11);
        doc.text(document.getElementById('display-cr-title').innerText, 20, 92);
        
        doc.setFontSize(14);
        doc.text("IMPACT ANALYSIS", 20, 110);
        doc.setFontSize(10);
        const splitImpact = doc.splitTextToSize(document.getElementById('cr-impact').value, 170);
        doc.text(splitImpact, 20, 117);
        
        doc.text("__________________________", 20, 250);
        doc.text("Authorizing Signature", 20, 255);
        
        doc.save(`${crId}_Governance_Doc.pdf`);
    };
</script>
</body>
</html>
