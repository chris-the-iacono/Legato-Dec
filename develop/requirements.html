<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Requirements & Tasks | Project Budget Manager</title>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .app-container { height: calc(100vh - 140px); display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; }
        .list-viewport { overflow-y: auto; flex-grow: 1; position: relative; }
        .active-req { background-color: #f5f3ff !important; border-left: 4px solid #6366f1 !important; }
        .active-task { background-color: #eff6ff !important; border-left: 4px solid #3b82f6 !important; }
        .side-slider { position: fixed; top: 0; width: 450px; height: 100vh; background: white; box-shadow: 0 0 40px rgba(0,0,0,0.15); transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1); z-index: 1000; display: flex; flex-direction: column; }
        #req-editor-panel { right: 0; transform: translateX(100%); }
        #req-editor-panel.active { transform: translateX(0); }
        #task-editor-panel { left: 0; transform: translateX(-100%); }
        #task-editor-panel.active { transform: translateX(0); }
        .cursor-move { cursor: move; }
        /* Disable Canvas as per instructions */
        canvas { display: none !important; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen overflow-hidden">
    <div id="main-header"></div>
    <main class="max-w-7xl mx-auto p-4 lg:p-6">
        <div class="app-container">
            <section class="bg-white rounded-xl shadow-sm border border-gray-200 flex flex-col overflow-hidden">
                <div class="px-4 py-4 border-b bg-gray-50/80 flex justify-between items-center">
                    <div>
                        <h3 class="font-bold text-gray-800">1. Requirements (Project Budgets)</h3>
                        <p id="req-count" class="text-[9px] text-gray-400 font-bold uppercase tracking-wider">0 ITEMS</p>
                    </div>
                    <button onclick="window.openReqSlider()" class="bg-indigo-600 text-white p-1.5 rounded-lg hover:bg-indigo-700 shadow-md">
                        <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-width="2" d="M12 4v16m8-8H4"/></svg>
                    </button>
                </div>
                <ul id="req-list" class="list-viewport divide-y divide-gray-100"></ul>
            </section>

            <section class="bg-white rounded-xl shadow-sm border border-gray-200 flex flex-col overflow-hidden">
                <div class="px-4 py-4 border-b bg-blue-50/80 flex justify-between items-center">
                    <div>
                        <h3 id="selected-req-title-display" class="font-bold text-gray-800">2. Task Breakdown</h3>
                        <p id="selected-req-budget-display" class="text-[10px] text-blue-600 font-black">$0.00</p>
                    </div>
                    <button id="add-task-btn" onclick="window.openTaskSlider()" disabled class="bg-blue-600 text-white p-1.5 rounded-lg opacity-50 cursor-not-allowed">
                        <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-width="2" d="M12 4v16m8-8H4"/></svg>
                    </button>
                </div>
                <ul id="step-list" class="list-viewport divide-y divide-gray-100"></ul>
            </section>
        </div>
    </main>

    <div id="req-editor-panel" class="side-slider">
        <div class="p-4 border-b bg-indigo-50 flex justify-between items-center">
            <h2 id="req-editor-title" class="font-bold">Requirement Details</h2>
            <button onclick="window.closeReqSlider()">&times;</button>
        </div>
        <div class="p-6 space-y-4">
            <input type="text" id="req-title-input" placeholder="Title" class="w-full p-2 border rounded">
            <select id="req-assign-select" class="w-full p-2 border rounded"></select>
            <input type="number" id="req-hours-input" placeholder="Hours" class="w-full p-2 border rounded">
            <input type="number" id="req-applied-rate" placeholder="Rate" class="w-full p-2 border rounded">
            <button id="req-save-btn" class="w-full bg-indigo-600 text-white py-2 rounded">Save Requirement</button>
            <div id="req-history-list" class="mt-4 text-xs space-y-2"></div>
        </div>
    </div>

    <div id="task-editor-panel" class="side-slider">
        <div class="p-4 border-b bg-blue-50 flex justify-between items-center">
            <h2 id="task-editor-title" class="font-bold">Task Details</h2>
            <button onclick="window.closeTaskSlider()">&times;</button>
        </div>
        <div class="p-6 space-y-4">
            <input type="text" id="step-title-input" class="w-full p-2 border rounded">
            <select id="step-assign-select" class="w-full p-2 border rounded"></select>
            <div class="grid grid-cols-2 gap-2">
                <input type="number" id="step-hours-input" class="p-2 border rounded">
                <input type="text" id="step-cost-input" readonly class="p-2 border rounded bg-gray-50">
            </div>
            <button id="task-save-btn" class="w-full bg-blue-600 text-white py-2 rounded">Save Task</button>
            <button id="delete-task-btn" class="w-full text-red-600 text-xs hidden">Delete Task</button>
            <div id="log-time-section" class="pt-4 border-t"></div>
            <div id="notes-container" class="space-y-2"></div>
        </div>
    </div>
	<script type="module">
    import { supabase } from './js/config.js';

    // Globals
    let projectId = new URLSearchParams(window.location.search).get('id');
    let tenantId = null;
    window.selectedReqId = null;
    window.projectBlendedRate = 0;
    window.teamMembers = [];

    // --- INITIALIZATION ---
    document.addEventListener('DOMContentLoaded', async () => {
    // 1. Auth Guard: Ensure user is logged in
    const { data: { user }, error: authError } = await supabase.auth.getUser();
    if (!user || authError) {
        console.warn("No active session found, redirecting to login.");
        return window.location.href = 'login.html';
    }

    // 2. Fetch User Profile to establish Role and Tenant context
    const { data: members, error: profileError } = await supabase.from('user_profiles').select('*');
    if (profileError) {
        console.error("Critical Error: Could not fetch user profiles.");
        return;
    }

    window.teamMembers = members || [];
    const myProfile = members.find(m => m.user_id === user.id);
    
    // Set global session data (RBAC and Multi-tenancy)
    window.sessionData = { 
        ...user, 
        role: myProfile?.role, 
        tenantId: myProfile?.tenant_id, 
        full_name: myProfile?.full_name,
        userId: user.id // Standardized for activity logging
    };

    // 3. Context Guard: Project Verification
    // [Fix]: Define projectId before using it in the Supabase query
    const projectId = localStorage.getItem('selected_project_id');
    const tenantId = myProfile?.tenant_id;

    if (!projectId) {
        console.warn("No project selected. Redirecting to selection page.");
        window.location.href = 'project-selection.html';
        return;
    }

    // 4. Fetch Project Settings (Blended Rate)
    const { data: proj, error: projError } = await supabase
        .from('projects')
        .select('*')
        .eq('id', projectId)
        .single();

    if (projError) {
        console.error("Error fetching project settings:", projError.message);
    }
    
    window.projectBlendedRate = proj?.blended_rate || 0;

    // 5. Initialize UI
    // These functions now have the global context they need to run safely
    if (typeof populateDropdowns === 'function') {
        populateDropdowns();
    }
    
    if (typeof loadRequirements === 'function') {
        await loadRequirements();
    }
    
    console.log("Initialization Complete: Requirement view loaded.");
});

    // --- REQUIREMENT ENGINE ---
    window.openReqSlider = async (id = null) => {
    const panel = document.getElementById('req-editor-panel');
    const titleEl = document.getElementById('req-editor-title');
    const btnEl = document.getElementById('req-save-btn');
    const versionEl = document.getElementById('req-version-display');
    const statusBadge = document.getElementById('req-status-badge');
    const historyContainer = document.getElementById('req-history-list');

    // 0. Permission Check: Admin, PM, and TL can edit. Team Member cannot.
    const canEdit = ['admin', 'project_manager', 'team_leader'].includes(window.sessionData?.role);

    // 1. Reset Form Fields
    const titleInput = document.getElementById('req-title-input');
    const hoursInput = document.getElementById('req-hours-input');
    const rateInput = document.getElementById('req-applied-rate');
    const assignSelect = document.getElementById('req-assign-select');

    if (titleInput) titleInput.value = '';
    if (hoursInput) hoursInput.value = 0;
    if (rateInput) rateInput.value = '';
    if (assignSelect) assignSelect.selectedIndex = 0;
    if (versionEl) versionEl.innerText = '0';
    if (historyContainer) historyContainer.innerHTML = '';

    // --- APPLY RBAC LOCKS ---
    if (titleInput) titleInput.readOnly = !canEdit;
    if (assignSelect) assignSelect.disabled = !canEdit;
    if (hoursInput) hoursInput.readOnly = !canEdit;
    if (rateInput) rateInput.readOnly = !canEdit;
    
    if (btnEl) {
        btnEl.style.display = canEdit ? 'block' : 'none';
    }

    if (!id) {
        // --- MODE: CREATE NEW ---
        window.selectedReqId = null; 
        titleEl.innerText = "Add New Requirement";
        btnEl.innerText = "Create Requirement";
        btnEl.onclick = () => window.addRequirement(); 
        
        if(statusBadge) {
            statusBadge.innerText = 'Draft';
            statusBadge.className = "text-[9px] px-2 py-0.5 rounded-full font-bold uppercase bg-gray-100 text-gray-600";
        }
    } else {
        // --- MODE: EDIT EXISTING ---
        const cleanId = String(id).trim().replace(/['"]/g, '');
        window.selectedReqId = cleanId; 
        titleEl.innerText = "Requirement Details";
        
        // Fetch using the CORRECT column name: req_id
        const { data: req, error } = await supabase
            .from('requirements')
            .select('*')
            .eq('req_id', cleanId)
            .single();
        
        if (error) {
            console.error("Error fetching requirement:", error.message);
            return;
        }
        
        if (req) {
            // --- NOMENCLATURE FIX ---
            // Per your instruction: Requirements use "title"
            if (titleInput) titleInput.value = req.title || req.name || '';
            
            if (assignSelect) assignSelect.value = req.assigned_to || '';
            if (hoursInput) hoursInput.value = req.estimated_hours || 0;
            if (rateInput) rateInput.value = req.custom_rate || '';
            if (versionEl) versionEl.innerText = req.version_number || '1';
            
            // --- UPDATED HISTORY LOGIC ---
            // Fetching from the standalone requirement_history table
            const { data: history } = await supabase
                .from('requirement_history')
                .select('*')
                .eq('requirement_id', cleanId)
                .order('created_at', { ascending: false });

            if (historyContainer && history) {
                if (typeof window.renderHistoryList === 'function') {
                    window.renderHistoryList(history);
                }
            }
            
            if(statusBadge) {
                statusBadge.innerText = req.status || 'Active';
                statusBadge.className = req.status === 'Complete' 
                    ? "text-[9px] px-2 py-0.5 rounded-full font-bold uppercase bg-green-100 text-green-700"
                    : "text-[9px] px-2 py-0.5 rounded-full font-bold uppercase bg-blue-100 text-blue-700";
            }

            btnEl.innerText = "Update Baseline Budget";
            btnEl.onclick = () => window.addRequirement(cleanId); 
        }
    }
    
    if (panel) panel.classList.add('active');
};	
	
	window.selectRequirement = async (id) => {
        const cleanId = String(id).trim().replace(/['"]/g, ''); // UUID Sanitization
        window.selectedReqId = cleanId;

        document.querySelectorAll('.req-row').forEach(el => el.classList.remove('active-req'));
        const activeRow = document.querySelector(`[data-id="${cleanId}"]`);
        if (activeRow) activeRow.classList.add('active-req');

        const { data: req } = await supabase.from('requirements').select('*').eq('req_id', cleanId).single();
        if (req) {
            document.getElementById('selected-req-title-display').innerText = `2. ${req.name}`;
            document.getElementById('selected-req-budget-display').innerText = `$${(req.total_budget || 0).toLocaleString()}`;
        }

        const btn = document.getElementById('add-task-btn');
        btn.disabled = false;
        btn.classList.remove('opacity-50', 'cursor-not-allowed');

        refreshSteps();
    };
	
	window.openTaskSlider = async (id = null) => {
    // 1. Guard Clause: Ensure context exists
    if (!window.selectedReqId) {
        alert("Please select a requirement first.");
        return;
    }

    const panel = document.getElementById('task-editor-panel');
    const titleEl = document.getElementById('task-editor-title');
    const btnEl = document.getElementById('task-save-btn');
    if (!panel || !titleEl || !btnEl) return;

    // 2. Role-Based Access Control (RBAC) UI Sync
    const isAdmin = window.sessionData?.role === 'admin';
    document.querySelectorAll('[data-admin-only]').forEach(el => {
        el.disabled = !isAdmin;
        if (!isAdmin) el.classList.add('bg-gray-100', 'cursor-not-allowed');
    });

    // 3. Reset Form (Clear previous state)
    document.getElementById('step-title-input').value = '';
    document.getElementById('step-assign-select').value = '';
    document.getElementById('step-hours-input').value = 0;
    document.getElementById('step-cost-input').value = "0.00";
    
    const notesContainer = document.getElementById('notes-container');
    if (notesContainer) notesContainer.innerHTML = '<p class="text-xs text-gray-400 italic">No activity yet.</p>';
    
    const existingSummary = document.getElementById('actuals-summary-display');
    if (existingSummary) existingSummary.remove();

    // 4. Open Panel
    panel.classList.add('active');

    // 5. Populate Mode (Edit vs. Create)
    if (id) {
        window.selectedStepId = id;
        titleEl.innerText = "Task Details";
        btnEl.innerText = "Update Baseline Changes";
        
        // Fetch Task Details from 'steps' table
        const { data: step, error } = await supabase.from('steps').select('*').eq('step_id', id).single();
        
        if (step) {
            // --- NOMENCLATURE FIX ---
            // Per your instruction: Steps/Tasks use "name" as the primary column
            const titleInput = document.getElementById('step-title-input');
            if (titleInput) {
                titleInput.value = step.name || step.title || '';
            }

            const assignSelect = document.getElementById('step-assign-select');
            if (assignSelect) {
                assignSelect.value = step.assigned_to || '';
            }

            const hoursInput = document.getElementById('step-hours-input');
            if (hoursInput) {
                hoursInput.value = step.estimated_hours || 0;
            }
            
            // FIX: Ensure cost displays correctly (total_cost is standard in your schema)
            const costInput = document.getElementById('step-cost-input');
            if (costInput) {
                costInput.value = (step.cost || step.total_cost || 0).toFixed(2);
            }
            
            btnEl.onclick = () => window.updateStep(id);
            if (typeof loadTaskNotes === 'function') loadTaskNotes(id);
        }

        // 6. Fetch and Display Actuals from 'time_logs' table
        const { data: logs } = await supabase
            .from('time_logs')
            .select('hours_spent, calculated_cost')
            .eq('task_id', id);

        const totalActualHrs = logs?.reduce((sum, l) => sum + (parseFloat(l.hours_spent) || 0), 0) || 0;
        const totalActualCost = logs?.reduce((sum, l) => sum + (parseFloat(l.calculated_cost) || 0), 0) || 0;

        const logSection = document.getElementById('log-time-section');
        if (logSection) {
            const summaryDiv = document.createElement('div');
            summaryDiv.id = 'actuals-summary-display';
            summaryDiv.className = "mb-6 p-4 bg-blue-50 rounded-xl border border-blue-100 shadow-sm";
            summaryDiv.innerHTML = `
                <div class="flex justify-between items-center">
                    <div>
                        <p class="text-[10px] font-black text-blue-400 uppercase tracking-wider">Total Actual Hours</p>
                        <p class="text-lg font-black text-blue-700">${totalActualHrs.toFixed(2)} <span class="text-xs font-normal">hrs</span></p>
                    </div>
                    <div class="text-right">
                        <p class="text-[10px] font-black text-blue-400 uppercase tracking-wider">Total Actual Cost</p>
                        <p class="text-lg font-black text-blue-700">$${totalActualCost.toLocaleString(undefined, {minimumFractionDigits: 2})}</p>
                    </div>
                </div>`;
            logSection.parentNode.insertBefore(summaryDiv, logSection);
        }

    } else {
        // Create Mode
        window.selectedStepId = null;
        titleEl.innerText = "Add New Task";
        btnEl.innerText = "Save Task";
        btnEl.onclick = () => window.submitStep();
    }
};

    window.rollupToRequirement = async (reqId) => {
    // 1. Sanitize the ID
    const cleanReqId = String(reqId).trim().replace(/['"]/g, '');
    
    // 2. Fetch all active tasks/steps for this requirement
    // Note: We use the 'steps' table as the source of truth for the rollup
    const { data: tasks, error } = await supabase.from('steps')
        .select('estimated_hours, cost, assigned_to')
        .eq('requirement_id', cleanReqId)
        .eq('is_active', true);

    if (error) {
        console.error("Rollup Error fetching tasks:", error.message);
        return;
    }

    let totalCost = 0;
    let totalHours = 0;

    // 3. Calculation Loop
    tasks.forEach(task => {
        const hrs = parseFloat(task.estimated_hours) || 0;
        let cost = parseFloat(task.cost) || 0;

        // Fallback Calculation logic: 
        // If no hard cost is set, calculate based on assignee rate or project default
        if (cost === 0 && hrs > 0) {
            const teamMembers = window.teamMembers || [];
            const user = teamMembers.find(m => m.user_id === task.assigned_to);
            
            // Priority: User Rate > Project Blended Rate > 0
            const rate = (user && parseFloat(user.hourly_cost) > 0) 
                ? parseFloat(user.hourly_cost) 
                : (parseFloat(window.projectBlendedRate) || 0);
                
            cost = hrs * rate;
        }
        
        totalCost += cost;
        totalHours += hrs;
    });

    // 4. Update the Requirements Table
    // This updates the "Budget" that the health score depends on
    const { error: updateError } = await supabase
        .from('requirements')
        .update({
            estimated_hours: totalHours,
            total_budget: totalCost,
            updated_at: new Date().toISOString()
        })
        .eq('req_id', cleanReqId);

    if (updateError) {
        console.error("Rollup Error updating requirement:", updateError.message);
        return;
    }

    // 5. Sync UI
    // Call the global version of loadRequirements to refresh the left-hand list
    if (typeof window.loadRequirements === 'function') {
        window.loadRequirements();
    }

    // Update the Budget display in the header if it exists
    const budgetDisplay = document.getElementById('selected-req-budget-display');
    if (budgetDisplay) {
        budgetDisplay.innerText = `$${totalCost.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}`;
    }

    console.log(`Rollup Complete for ${cleanReqId}: $${totalCost} / ${totalHours}h`);
};

    // UI ENGINE
window.loadRequirements = async () => {
    // 1. Context Retrieval & Validation
    const projectId = localStorage.getItem('selected_project_id');
    const tenantId = window.sessionData?.tenantId;

    if (!projectId || projectId === "null" || !tenantId) {
        console.warn("loadRequirements: Missing required IDs. Aborting fetch.");
        return;
    }

    // 2. Data Fetching
    const { data: reqs, error } = await supabase
        .from('requirements')
        .select(`*, assignee:assigned_to(full_name)`)
        .eq('project_id', projectId)
        .eq('tenant_id', tenantId)
        .order('sequence_order');

    if (error) {
        console.error("Supabase Error in loadRequirements:", error.message);
        return;
    }

    // 3. DOM Elements
    const list = document.getElementById('req-list');
    const countEl = document.getElementById('req-count');
    if (!list) return;

    // 4. Null-Safe Data Check
    const safeReqs = reqs || [];
    if (countEl) countEl.innerText = `${safeReqs.length} ITEMS`;

    if (safeReqs.length === 0) {
        list.innerHTML = `<div class="p-10 text-center text-gray-400 italic">No requirements found.</div>`;
        return;
    }

    // 5. Render
    list.innerHTML = safeReqs.map(req => {
        // --- NOMENCLATURE FIX ---
        // Per your instruction: Requirements use "title"
        const displayTitle = req.title || req.name || 'Untitled Requirement';
        
        const displayTotal = req.total_budget || 0;
        const menuHtml = (typeof window.getKabobMenu === 'function') ? window.getKabobMenu(req, 'req') : '';
        const isActive = window.selectedReqId === req.req_id ? 'border-indigo-600 bg-indigo-50/30' : 'border-transparent';

        return `
            <li class="req-row p-4 hover:bg-gray-50 flex justify-between items-center cursor-pointer border-l-4 ${isActive} transition-all" 
                data-id="${req.req_id}" onclick="window.selectRequirement('${req.req_id}')">
                
                <div class="flex items-center gap-3">
                    <input type="checkbox" class="w-4 h-4 rounded border-gray-300" onclick="event.stopPropagation()">
                    <span class="cursor-move text-gray-300 font-bold p-1">::</span>
                    
                    <div>
                        <p class="text-sm font-bold text-gray-800">${displayTitle}</p>
                        <p class="text-[10px] text-gray-400 font-bold uppercase">
                            ${req.assignee?.full_name || 'Unassigned'} | ${req.estimated_hours || 0}h
                        </p>
                    </div>
                </div>

                <div class="flex items-center gap-4">
                    <p class="text-sm font-mono font-bold text-indigo-600">$${Number(displayTotal).toLocaleString()}</p>
                    <div class="relative kebab-container">
                        <button onclick="event.stopPropagation(); window.toggleKebab('req-${req.req_id}')" class="p-1 text-gray-400 hover:text-indigo-600">
                            <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path d="M12 5v.01M12 12v.01M12 19v.01M12 6a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2z" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            </svg>
                        </button>
                        ${menuHtml}
                    </div>
                </div>
            </li>
        `;
    }).join('');

    // 6. Sortable Initialization
    if (typeof window.initSortable === 'function') {
        setTimeout(window.initSortable, 50);
    }
}

window.getKabobMenu = (item, type) => {
    // Standardize the ID based on the object property (req_id or step_id)
    const id = item.req_id || item.step_id || item.id;
    const menuId = `kebab-${type}-${id}`;

    return `
        <div id="${menuId}" class="hidden absolute right-0 mt-2 w-48 bg-white rounded-xl shadow-xl border border-gray-100 z-[1000] overflow-hidden">
            <div class="py-1">
                <button onclick="event.stopPropagation(); window.open${type === 'req' ? 'Req' : 'Task'}Slider('${id}')" 
                    class="flex items-center w-full px-4 py-3 text-sm text-gray-700 hover:bg-indigo-50 hover:text-indigo-600 transition-colors">
                    <svg class="w-4 h-4 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                    Edit Details
                </button>
                <button onclick="event.stopPropagation(); window.delete${type === 'req' ? 'Requirement' : 'Step'}('${id}')" 
                    class="flex items-center w-full px-4 py-3 text-sm text-red-600 hover:bg-red-50 transition-colors">
                    <svg class="w-4 h-4 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-4v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                    Delete ${type === 'req' ? 'Requirement' : 'Task'}
                </button>
            </div>
        </div>
    `;
};

// --- HELPER: TOGGLE KEBAB ---
// Attached to window to fix the "Not a function" error from inline onclicks
window.toggleKebab = (id) => {
    const menuId = `kebab-${id}`;
    const targetMenu = document.getElementById(menuId);
    
    if (!targetMenu) {
        console.error(`Kebab menu not found: ${menuId}`);
        return;
    }

    // Check if the menu we clicked is already open
    const isAlreadyOpen = !targetMenu.classList.contains('hidden');

    // 1. Close ALL open kebab menus first (to prevent overlapping)
    document.querySelectorAll('[id^="kebab-"]').forEach(el => el.classList.add('hidden'));

    // 2. If it wasn't open, open it now. If it was open, leave it hidden (toggled)
    if (!isAlreadyOpen) {
        targetMenu.classList.remove('hidden');
    }

    // 3. Global click listener to close kebab if user clicks anywhere else
    const closeMenus = (e) => {
        if (!e.target.closest('.kebab-container')) {
            targetMenu.classList.add('hidden');
            document.removeEventListener('click', closeMenus);
        }
    };
    
    // Use a tiny timeout so the current click doesn't immediately trigger the closeMenus logic
    setTimeout(() => {
        document.addEventListener('click', closeMenus);
    }, 10);
};

    window.refreshSteps = async () => {
    // 1. Safety Guard: Don't fetch if no requirement is selected
    const reqId = window.selectedReqId;
    if (!reqId) return;

    // 2. Data Fetching
    const { data: steps, error } = await supabase
        .from('steps')
        .select('*')
        .eq('requirement_id', reqId)
        .eq('is_active', true)
        .order('sequence_order');

    if (error) {
        console.error("Error refreshing steps:", error.message);
        return;
    }

    const list = document.getElementById('step-list');
    if (!list) return;

    // 3. Render Loop
    const safeSteps = steps || [];
    list.innerHTML = safeSteps.map(s => {
        // --- NOMENCLATURE FIX ---
        // Per your instruction: Steps/Tasks use "name"
        const taskName = s.name || s.title || 'Untitled Task';
        const taskCost = s.cost || s.total_cost || 0;
        const taskHours = s.estimated_hours || 0;
        
        // Generate the kebab HTML (Function #17)
        const menuHtml = (typeof window.getKabobMenu === 'function') 
            ? window.getKabobMenu(s, 'task') 
            : '';

        return `
            <li class="p-4 flex justify-between items-center hover:bg-indigo-50/50 border-b border-gray-50 cursor-pointer group transition-colors" 
                onclick="window.openTaskSlider('${s.step_id}')">
                
                <div class="flex flex-col">
                    <span class="text-sm font-bold text-gray-800">${taskName}</span>
                    <span class="text-[10px] text-gray-400 font-bold uppercase tracking-tight">
                        Est: ${taskHours}h | Assigned: ${s.assigned_to ? 'Yes' : 'No'}
                    </span>
                </div>

                <div class="flex items-center gap-4">
                    <span class="text-xs font-mono font-bold text-indigo-600">
                        $${Number(taskCost).toLocaleString()}
                    </span>
                    
                    <div class="relative kebab-container">
                        <button onclick="event.stopPropagation(); window.toggleKebab('task-${s.step_id}')" 
                            class="p-2 text-gray-400 hover:text-indigo-600 rounded-full hover:bg-white transition-all">
                            <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path d="M12 5v.01M12 12v.01M12 19v.01M12 6a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2z" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            </svg>
                        </button>
                        ${menuHtml}
                    </div>
                </div>
            </li>
        `;
    }).join('');
};

    function populateDropdowns() {
    // 1. Verify Data Source
    if (!window.teamMembers || !Array.isArray(window.teamMembers)) {
        console.warn("populateDropdowns: No team members found to populate lists.");
        return;
    }

    // 2. Generate Options HTML
    // Start with a blank default option
    const optionsHtml = `
        <option value="">Select Resource</option>
        ${window.teamMembers.map(m => `
            <option value="${m.user_id}">${m.full_name || m.email || 'Unknown User'}</option>
        `).join('')}
    `;

    // 3. Targeted Injection with Safety Checks
    const reqSelect = document.getElementById('req-assign-select');
    const stepSelect = document.getElementById('step-assign-select');

    if (reqSelect) {
        reqSelect.innerHTML = optionsHtml;
    } else {
        console.error("Missing DOM element: req-assign-select");
    }

    if (stepSelect) {
        stepSelect.innerHTML = optionsHtml;
    } else {
        // Logging as info because the step slider might be in a different template/partial
        console.info("Optional DOM element not found: step-assign-select");
    }
    
    console.log(`Dropdowns populated with ${window.teamMembers.length} resources.`);
}
