<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Requirements & Tasks | Project Budget Manager</title>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .app-container { height: calc(100vh - 140px); display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; }
        .list-viewport { overflow-y: auto; flex-grow: 1; position: relative; }
        .active-req { background-color: #f5f3ff !important; border-left: 4px solid #6366f1 !important; }
        .active-task { background-color: #eff6ff !important; border-left: 4px solid #3b82f6 !important; }
        .side-slider { position: fixed; top: 0; width: 450px; height: 100vh; background: white; box-shadow: 0 0 40px rgba(0,0,0,0.15); transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1); z-index: 1000; display: flex; flex-direction: column; }
        #req-editor-panel { right: 0; transform: translateX(100%); }
        #req-editor-panel.active { transform: translateX(0); }
        #task-editor-panel { left: 0; transform: translateX(-100%); }
        #task-editor-panel.active { transform: translateX(0); }
        .cursor-move { cursor: move; }
        /* Disable Canvas as per instructions */
        canvas { display: none !important; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen overflow-hidden">
    <div id="main-header"></div>
    <main class="max-w-7xl mx-auto p-4 lg:p-6">
        <div class="app-container">
            <section class="bg-white rounded-xl shadow-sm border border-gray-200 flex flex-col overflow-hidden">
                <div class="px-4 py-4 border-b bg-gray-50/80 flex justify-between items-center">
                    <div>
                        <h3 class="font-bold text-gray-800">1. Requirements (Project Budgets)</h3>
                        <p id="req-count" class="text-[9px] text-gray-400 font-bold uppercase tracking-wider">0 ITEMS</p>
                    </div>
                    <button onclick="window.openReqSlider()" class="bg-indigo-600 text-white p-1.5 rounded-lg hover:bg-indigo-700 shadow-md">
                        <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-width="2" d="M12 4v16m8-8H4"/></svg>
                    </button>
                </div>
                <ul id="req-list" class="list-viewport divide-y divide-gray-100"></ul>
            </section>

            <section class="bg-white rounded-xl shadow-sm border border-gray-200 flex flex-col overflow-hidden">
                <div class="px-4 py-4 border-b bg-blue-50/80 flex justify-between items-center">
                    <div>
                        <h3 id="selected-req-title-display" class="font-bold text-gray-800">2. Task Breakdown</h3>
                        <p id="selected-req-budget-display" class="text-[10px] text-blue-600 font-black">$0.00</p>
                    </div>
                    <button id="add-task-btn" onclick="window.openTaskSlider()" disabled class="bg-blue-600 text-white p-1.5 rounded-lg opacity-50 cursor-not-allowed">
                        <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-width="2" d="M12 4v16m8-8H4"/></svg>
                    </button>
                </div>
                <ul id="step-list" class="list-viewport divide-y divide-gray-100"></ul>
            </section>
        </div>
    </main>

    <div id="req-editor-panel" class="side-slider">
        <div class="p-4 border-b bg-indigo-50 flex justify-between items-center">
            <h2 id="req-editor-title" class="font-bold">Requirement Details</h2>
            <button onclick="window.closeReqSlider()">&times;</button>
        </div>
        <div class="p-6 space-y-4">
            <input type="text" id="req-title-input" placeholder="Title" class="w-full p-2 border rounded">
            <select id="req-assign-select" class="w-full p-2 border rounded"></select>
            <input type="number" id="req-hours-input" placeholder="Hours" class="w-full p-2 border rounded">
            <input type="number" id="req-applied-rate" placeholder="Rate" class="w-full p-2 border rounded">
            <button id="req-save-btn" class="w-full bg-indigo-600 text-white py-2 rounded">Save Requirement</button>
            <div id="req-history-list" class="mt-4 text-xs space-y-2"></div>
        </div>
    </div>

    <div id="task-editor-panel" class="side-slider">
        <div class="p-4 border-b bg-blue-50 flex justify-between items-center">
            <h2 id="task-editor-title" class="font-bold">Task Details</h2>
            <button onclick="window.closeTaskSlider()">&times;</button>
        </div>
        <div class="p-6 space-y-4">
            <input type="text" id="step-title-input" class="w-full p-2 border rounded">
            <select id="step-assign-select" class="w-full p-2 border rounded"></select>
            <div class="grid grid-cols-2 gap-2">
                <input type="number" id="step-hours-input" class="p-2 border rounded">
                <input type="text" id="step-cost-input" readonly class="p-2 border rounded bg-gray-50">
            </div>
            <button id="task-save-btn" class="w-full bg-blue-600 text-white py-2 rounded">Save Task</button>
            <button id="delete-task-btn" class="w-full text-red-600 text-xs hidden">Delete Task</button>
            <div id="log-time-section" class="pt-4 border-t"></div>
            <div id="notes-container" class="space-y-2"></div>
        </div>
    </div>
	<script type="module">
    import { supabase } from './js/config.js';

    // Globals
    let projectId = new URLSearchParams(window.location.search).get('id');
    let tenantId = null;
    window.selectedReqId = null;
    window.projectBlendedRate = 0;
    window.teamMembers = [];

    // --- INITIALIZATION ---
    document.addEventListener('DOMContentLoaded', async () => {
    // 1. Auth Guard: Ensure user is logged in
    const { data: { user }, error: authError } = await supabase.auth.getUser();
    if (!user || authError) {
        console.warn("No active session found, redirecting to login.");
        return window.location.href = 'login.html';
    }

    // 2. Fetch User Profile to establish Role and Tenant context
    const { data: members, error: profileError } = await supabase.from('user_profiles').select('*');
    if (profileError) {
        console.error("Critical Error: Could not fetch user profiles.");
        return;
    }

    window.teamMembers = members || [];
    const myProfile = members.find(m => m.user_id === user.id);
    
    // Set global session data (RBAC and Multi-tenancy)
    window.sessionData = { 
        ...user, 
        role: myProfile?.role, 
        tenantId: myProfile?.tenant_id, 
        full_name: myProfile?.full_name,
        userId: user.id // Standardized for activity logging
    };

    // 3. Context Guard: Project Verification
    // [Fix]: Define projectId before using it in the Supabase query
    const projectId = localStorage.getItem('selected_project_id');
    const tenantId = myProfile?.tenant_id;

    if (!projectId) {
        console.warn("No project selected. Redirecting to selection page.");
        window.location.href = 'project-selection.html';
        return;
    }

    // 4. Fetch Project Settings (Blended Rate)
    const { data: proj, error: projError } = await supabase
        .from('projects')
        .select('*')
        .eq('id', projectId)
        .single();

    if (projError) {
        console.error("Error fetching project settings:", projError.message);
    }
    
    window.projectBlendedRate = proj?.blended_rate || 0;

    // 5. Initialize UI
    // These functions now have the global context they need to run safely
    if (typeof populateDropdowns === 'function') {
        populateDropdowns();
    }
    
    if (typeof loadRequirements === 'function') {
        await loadRequirements();
    }
    
    console.log("Initialization Complete: Requirement view loaded.");
});

    // --- REQUIREMENT ENGINE ---
    window.selectRequirement = async (id) => {
        const cleanId = String(id).trim().replace(/['"]/g, ''); // UUID Sanitization
        window.selectedReqId = cleanId;

        document.querySelectorAll('.req-row').forEach(el => el.classList.remove('active-req'));
        const activeRow = document.querySelector(`[data-id="${cleanId}"]`);
        if (activeRow) activeRow.classList.add('active-req');

        const { data: req } = await supabase.from('requirements').select('*').eq('req_id', cleanId).single();
        if (req) {
            document.getElementById('selected-req-title-display').innerText = `2. ${req.name}`;
            document.getElementById('selected-req-budget-display').innerText = `$${(req.total_budget || 0).toLocaleString()}`;
        }

        const btn = document.getElementById('add-task-btn');
        btn.disabled = false;
        btn.classList.remove('opacity-50', 'cursor-not-allowed');

        refreshSteps();
    };

    window.rollupToRequirement = async (reqId) => {
        const cleanReqId = String(reqId).trim().replace(/['"]/g, '');
        
        const { data: tasks, error } = await supabase.from('steps')
            .select('estimated_hours, cost, assigned_to')
            .eq('requirement_id', cleanReqId)
            .eq('is_active', true);

        if (error) return console.error("Rollup Error:", error);

        let totalCost = 0;
        let totalHours = 0;

        tasks.forEach(task => {
            const hrs = parseFloat(task.estimated_hours) || 0;
            let cost = parseFloat(task.cost) || 0;

            // Fallback Calculation logic
            if (cost === 0 && hrs > 0) {
                const user = window.teamMembers.find(m => m.user_id === task.assigned_to);
                const rate = (user && parseFloat(user.hourly_cost) > 0) ? user.hourly_cost : window.projectBlendedRate;
                cost = hrs * rate;
            }
            totalCost += cost;
            totalHours += hrs;
        });

        await supabase.from('requirements').update({
            estimated_hours: totalHours,
            total_budget: totalCost,
            updated_at: new Date().toISOString()
        }).eq('req_id', cleanReqId);

        loadRequirements(); // Sync UI
        document.getElementById('selected-req-budget-display').innerText = `$${totalCost.toLocaleString()}`;
    };

    // --- UI ENGINE ---
    async function loadRequirements() {
    // 1. Context Retrieval & Validation
    const projectId = localStorage.getItem('selected_project_id');
    const tenantId = window.sessionData?.tenantId;

    // Prevention of 400 error
    if (!projectId || projectId === "null" || !tenantId) {
        console.warn("loadRequirements: Missing required IDs. Aborting fetch.");
        return;
    }

    // 2. Data Fetching
    const { data: reqs, error } = await supabase
        .from('requirements')
        .select(`*, assignee:assigned_to(full_name)`)
        .eq('project_id', projectId)
        .eq('tenant_id', tenantId) // Security check
        .order('sequence_order');

    if (error) {
        console.error("Supabase Error in loadRequirements:", error.message);
        return;
    }

    // 3. DOM Elements
    const list = document.getElementById('req-list');
    const countEl = document.getElementById('req-count');
    if (!list) return;

    // 4. Null-Safe Mapping (Fixes Line 229 TypeError)
    const safeReqs = reqs || [];
    if (countEl) countEl.innerText = `${safeReqs.length} ITEMS`;

    if (safeReqs.length === 0) {
        list.innerHTML = `<div class="p-10 text-center text-gray-400 italic">No requirements found.</div>`;
        return;
    }

    // 5. Render
    list.innerHTML = safeReqs.map(req => {
        // Fallback calculations for display
        const displayTotal = req.total_budget || 0;
        const menuHtml = (typeof getKabobMenu === 'function') ? getKabobMenu(req, 'req') : '';
        const isActive = window.selectedReqId === req.req_id ? 'border-indigo-600 bg-indigo-50/30' : 'border-transparent';

        return `
            <li class="req-row p-4 hover:bg-gray-50 flex justify-between items-center cursor-pointer border-l-4 ${isActive} transition-all" 
                data-id="${req.req_id}" onclick="window.selectRequirement('${req.req_id}')">
                
                <div class="flex items-center gap-3">
                    <input type="checkbox" class="w-4 h-4 rounded border-gray-300" onclick="event.stopPropagation()">
                    <span class="cursor-move text-gray-300 font-bold p-1">::</span>
                    
                    <div>
                        <p class="text-sm font-bold text-gray-800">${req.name || 'Untitled'}</p>
                        <p class="text-[10px] text-gray-400 font-bold uppercase">
                            ${req.assignee?.full_name || 'Unassigned'} | ${req.estimated_hours || 0}h
                        </p>
                    </div>
                </div>

                <div class="flex items-center gap-4">
                    <p class="text-sm font-mono font-bold text-indigo-600">$${Number(displayTotal).toLocaleString()}</p>
                    <div class="relative kebab-container">
                        <button onclick="event.stopPropagation(); window.toggleKebab('req-${req.req_id}')" class="p-1 text-gray-400 hover:text-indigo-600">
                            <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path d="M12 5v.01M12 12v.01M12 19v.01M12 6a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2z" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            </svg>
                        </button>
                        ${menuHtml}
                    </div>
                </div>
            </li>
        `;
    }).join('');

    // 6. Sortable Initialization
    if (typeof window.initSortable === 'function') {
        setTimeout(window.initSortable, 50);
    }
}

    async function refreshSteps() {
        const { data: steps } = await supabase.from('steps').select('*').eq('requirement_id', window.selectedReqId).eq('is_active', true).order('sequence_order');
        const list = document.getElementById('step-list');
        list.innerHTML = steps.map(s => `
            <li class="p-4 flex justify-between items-center hover:bg-blue-50 cursor-pointer" onclick="window.openTaskSlider('${s.step_id}')">
                <span class="text-sm font-medium">${s.title}</span>
                <span class="text-xs font-mono">$${(s.cost || 0).toLocaleString()}</span>
            </li>
        `).join('');
    }

    function populateDropdowns() {
    // 1. Verify Data Source
    if (!window.teamMembers || !Array.isArray(window.teamMembers)) {
        console.warn("populateDropdowns: No team members found to populate lists.");
        return;
    }

    // 2. Generate Options HTML
    // Start with a blank default option
    const optionsHtml = `
        <option value="">Select Resource</option>
        ${window.teamMembers.map(m => `
            <option value="${m.user_id}">${m.full_name || m.email || 'Unknown User'}</option>
        `).join('')}
    `;

    // 3. Targeted Injection with Safety Checks
    const reqSelect = document.getElementById('req-assign-select');
    const stepSelect = document.getElementById('step-assign-select');

    if (reqSelect) {
        reqSelect.innerHTML = optionsHtml;
    } else {
        console.error("Missing DOM element: req-assign-select");
    }

    if (stepSelect) {
        stepSelect.innerHTML = optionsHtml;
    } else {
        // Logging as info because the step slider might be in a different template/partial
        console.info("Optional DOM element not found: step-assign-select");
    }
    
    console.log(`Dropdowns populated with ${window.teamMembers.length} resources.`);
}

    window.closeReqSlider = () => document.getElementById('req-editor-panel').classList.remove('active');
    window.closeTaskSlider = () => document.getElementById('task-editor-panel').classList.remove('active');
    // ... Additional slider logic logic here ...
</script>
</body>
</html>
