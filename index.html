<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Selection | Project Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">

    <div id="main-header"></div>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <div class="mb-8 flex justify-between items-center">
            <h2 class="text-xl font-black text-gray-800 uppercase tracking-tight">Your Projects</h2>
            <button onclick="toggleProjectModal()" class="bg-indigo-600 text-white px-4 py-2 rounded-lg font-bold text-sm hover:bg-indigo-700 transition shadow-sm flex items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
                </svg>
                Create Project
            </button>
        </div>

        <div id="project-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <div class="col-span-full py-20 text-center">
                <p class="text-gray-400 font-medium">Loading your workspace projects...</p>
            </div>
        </div>
    </main>

    <div id="project-modal" class="fixed inset-0 bg-gray-900/60 backdrop-blur-sm hidden flex items-center justify-center z-[2000]">
        <div class="bg-white rounded-2xl shadow-2xl p-8 w-full max-w-2xl border border-gray-100">
            <h2 class="text-2xl font-black text-gray-900 mb-2">Initialize New Project</h2>
            <p class="text-sm text-gray-500 mb-6">Define the baseline, leadership, and governance thresholds.</p>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="space-y-4">
                    <div>
                        <label class="block text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-1 ml-1">Project Code / Name</label>
                        <input type="text" id="new-project-name" placeholder="e.g. Q1-TRANSFORM" class="w-full border border-gray-200 rounded-xl p-3 text-sm outline-none focus:ring-2 focus:ring-indigo-500 transition-all">
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-1 ml-1">Brief Description</label>
                        <input type="text" id="new-project-title" placeholder="e.g. Digital Infrastructure Upgrade" class="w-full border border-gray-200 rounded-xl p-3 text-sm outline-none focus:ring-2 focus:ring-indigo-500 transition-all">
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-1 ml-1">Reason (Business Case)</label>
                        <textarea id="new-project-reason" rows="3" placeholder="Strategic justification for this project..." class="w-full border border-gray-200 rounded-xl p-3 text-sm outline-none focus:ring-2 focus:ring-indigo-500 transition-all"></textarea>
                    </div>
                </div>

                <div class="space-y-4">
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-1 ml-1">PM Threshold (%)</label>
                            <input type="number" id="new-project-pm-limit" value="10" class="w-full border border-gray-200 rounded-xl p-3 text-sm outline-none focus:ring-2 focus:ring-indigo-500 transition-all">
                        </div>
                        <div>
                            <label class="block text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-1 ml-1">Exec Threshold (%)</label>
                            <input type="number" id="new-project-exec-limit" value="25" class="w-full border border-gray-200 rounded-xl p-3 text-sm outline-none focus:ring-2 focus:ring-indigo-500 transition-all">
                        </div>
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-1 ml-1">Executive Sponsor</label>
                        <select id="new-project-exec" class="w-full border border-gray-200 rounded-xl p-3 text-sm outline-none focus:ring-2 focus:ring-indigo-500 bg-white">
                            <option value="">Loading team...</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-1 ml-1">Project Manager</label>
                        <select id="new-project-pm" class="w-full border border-gray-200 rounded-xl p-3 text-sm outline-none focus:ring-2 focus:ring-indigo-500 bg-white">
                            <option value="">Loading team...</option>
                        </select>
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-1 ml-1">Blended Rate ($)</label>
                            <input type="number" id="new-project-rate" value="150" class="w-full border border-gray-200 rounded-xl p-3 text-sm outline-none focus:ring-2 focus:ring-indigo-500 transition-all">
                        </div>
                        <div>
                            <label class="block text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-1 ml-1">Priority (1-100)</label>
                            <input type="number" id="new-project-priority" min="1" max="100" value="50" class="w-full border border-gray-200 rounded-xl p-3 text-sm outline-none focus:ring-2 focus:ring-indigo-500 transition-all">
                        </div>
                    </div>
                </div>
            </div>

            <div class="mt-8 flex gap-3">
                <button onclick="toggleProjectModal()" class="flex-1 px-4 py-3 text-sm font-bold text-gray-500 hover:bg-gray-50 rounded-xl transition">Cancel</button>
                <button onclick="saveNewProject()" class="flex-1 bg-indigo-600 text-white px-4 py-3 rounded-xl font-bold text-sm hover:bg-indigo-700 shadow-lg transition-all">
                    Create Project Baseline
                </button>
            </div>
        </div>
    </div>

<script type="module">
    import { supabase } from './js/config.js';
    import { checkAccess } from './js/auth.js';
    import { renderProjectHeader } from './js/components.js';

    let sessionData = null;

    document.addEventListener('DOMContentLoaded', async () => {
        try {
            sessionData = await checkAccess();
            if (!sessionData) return;
            window.sessionData = sessionData;

            renderProjectHeader(sessionData, 'dashboard', 'Project Selection');
            await loadProjects();
        } catch (err) {
            console.error("Init Error:", err);
        }
    });

    async function populateLeadershipDropdowns() {
        try {
            const { data: users, error } = await supabase
                .from('user_profiles')
                .select('user_id, full_name')
                .order('full_name', { ascending: true });

            if (error) throw error;

            const sponsorSelect = document.getElementById('new-project-exec');
            const pmSelect = document.getElementById('new-project-pm');
            
            const options = users.map(u => `<option value="${u.user_id}">${u.full_name}</option>`).join('');
            const placeholder = '<option value="">Select Member...</option>';

            if (sponsorSelect) sponsorSelect.innerHTML = placeholder + options;
            if (pmSelect) pmSelect.innerHTML = placeholder + options;
        } catch (err) {
            console.error("Error loading team:", err);
        }
    }

    async function loadProjects() {
        try {
            const { data, error } = await supabase
                .from('projects')
                .select(`
                    *,
                    requirements (
                        total_budget,
                        created_at,
                        steps (
                            cost,
                            status,
                            is_active
                        )
                    )
                `)
                .eq('tenant_id', sessionData.tenantId)
                .order('created_at', { ascending: false });

            if (error) throw error;
            renderProjectCards(data || []);
        } catch (err) {
            console.error("Load Error:", err);
            document.getElementById('project-list').innerHTML = `<p class="text-red-500 text-center col-span-full">Failed to load projects.</p>`;
        }
    }

    function renderProjectCards(projects) {
        const container = document.getElementById('project-list');
        
        if (!projects.length) {
            container.innerHTML = `<div class="col-span-full py-20 text-center border-2 border-dashed border-gray-200 rounded-2xl">
                <p class="text-gray-400">No projects found. Create your first one above!</p>
            </div>`;
            return;
        }

        container.innerHTML = projects.map(project => {
            const dates = project.requirements?.map(r => new Date(r.created_at)) || [];
            const startDate = dates.length ? new Date(Math.min(...dates)).toLocaleDateString() : (project.start_date ? new Date(project.start_date).toLocaleDateString() : 'Pending');
            const estCost = project.requirements?.reduce((sum, r) => sum + (r.total_budget || 0), 0) || 0;
            const actualCost = project.requirements?.reduce((acc, req) => {
                const doneSum = req.steps?.filter(s => s.is_active && s.status === 'Complete')
                                     .reduce((sum, s) => sum + (s.cost || 0), 0);
                return acc + (doneSum || 0);
            }, 0) || 0;
            const burnPercent = estCost > 0 ? Math.round((actualCost / estCost) * 100) : 0;
            const balance = estCost - actualCost;

            return `
                <div onclick="openProject('${project.id}', '${project.name}')" 
                     class="bg-white rounded-2xl border border-gray-200 shadow-sm hover:shadow-xl hover:border-indigo-300 transition-all cursor-pointer group flex flex-col overflow-hidden">
                    
                    <div class="p-6">
                        <div class="flex justify-between items-start mb-4">
                            <span class="text-[10px] font-black text-indigo-600 uppercase tracking-widest">${project.name}</span>
                            <span class="text-[10px] font-bold text-gray-400">Target Start: ${startDate}</span>
                        </div>
                        
                        <h3 class="text-lg font-black text-gray-900 mb-1 group-hover:text-indigo-600 transition-colors">${project.title}</h3>
                        
                        <div class="mt-6 space-y-4">
                            <div>
                                <div class="flex justify-between text-[10px] font-black uppercase tracking-tight mb-1">
                                    <span class="text-gray-500">Budget Consumed</span>
                                    <span class="${burnPercent > 90 ? 'text-red-600' : 'text-indigo-600'}">${burnPercent}%</span>
                                </div>
                                <div class="w-full bg-gray-100 h-1.5 rounded-full overflow-hidden">
                                    <div class="h-full ${burnPercent > 90 ? 'bg-red-500' : 'bg-indigo-500'} transition-all duration-500" 
                                         style="width: ${Math.min(burnPercent, 100)}%"></div>
                                </div>
                            </div>

                            <div class="grid grid-cols-2 gap-4 pt-2">
                                <div>
                                    <p class="text-[9px] font-bold text-gray-400 uppercase">Budget</p>
                                    <p class="text-sm font-black text-gray-900">$${estCost.toLocaleString()}</p>
                                </div>
                                <div>
                                    <p class="text-[9px] font-bold text-gray-400 uppercase">Balance</p>
                                    <p class="text-sm font-black ${balance < 0 ? 'text-red-600' : 'text-green-600'}">$${balance.toLocaleString()}</p>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="mt-auto bg-gray-50 px-6 py-3 flex justify-between items-center border-t border-gray-100">
                        <div class="flex items-center gap-1">
                             <div class="w-2 h-2 rounded-full ${project.status === 'Active' ? 'bg-green-500' : 'bg-gray-400'}"></div>
                             <span class="text-[10px] font-bold text-gray-500 uppercase">${project.status || 'Active'}</span>
                        </div>
                        <span class="text-[10px] font-bold text-indigo-500 group-hover:translate-x-1 transition-transform">Enter Hub &rarr;</span>
                    </div>
                </div>
            `;
        }).join('');
    }

    window.toggleProjectModal = async () => {
        const modal = document.getElementById('project-modal');
        if (!modal) return;
        const isHidden = modal.classList.contains('hidden');
        if (isHidden) await populateLeadershipDropdowns();
        modal.classList.toggle('hidden');
    };

    window.openProject = (id, name) => {
        localStorage.setItem('selected_project_id', id);
        localStorage.setItem('selected_project_name', name);
        // NAVIGATION UPDATED TO WINDSHIELD
        window.location.href = 'windshield.html';
    };

    window.saveNewProject = async () => {
        try {
            const name = document.getElementById('new-project-name').value.trim();
            const title = document.getElementById('new-project-title').value.trim();
            const reason = document.getElementById('new-project-reason').value.trim();
            const sponsor = document.getElementById('new-project-exec').value;
            const pm = document.getElementById('new-project-pm').value;
            const pmThreshold = parseFloat(document.getElementById('new-project-pm-limit').value) || 10;
            const execThreshold = parseFloat(document.getElementById('new-project-exec-limit').value) || 25;
            const rate = parseFloat(document.getElementById('new-project-rate').value) || 150;
            const priority = parseInt(document.getElementById('new-project-priority').value) || 50;

            if (!name || !title) return alert("Please fill in Name and Title.");

            const { error } = await supabase.from('projects').insert([{
                name, 
                title, 
                project_reason: reason,
                executive_sponsor_id: sponsor || null,
                project_manager_id: pm || null,
                threshold_pm_limit: pmThreshold,
                threshold_exec_limit: execThreshold,
                tenant_id: sessionData.tenantId, 
                blended_rate: rate, 
                status: 'Active', 
                priority_value: priority,
                health_score: 100 // Initial health
            }]);

            if (error) throw error;
            window.toggleProjectModal();
            await loadProjects();
        } catch (err) {
            alert("Save failed: " + err.message);
        }
    };

    window.loadProjects = loadProjects;
</script>
</body>
</html>
