<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">

    <div id="main-header"></div>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <div class="flex justify-between items-center mb-8">
            <h1 class="text-3xl font-bold text-gray-900">Project Dashboard</h1>
            <button onclick="toggleProjectModal()" 
                    class="bg-indigo-600 text-white px-4 py-2 rounded-md hover:bg-indigo-700 transition">
                + New Project
            </button>
        </div>

        <div id="project-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            </div>
    </main>

    <div id="project-modal" class="fixed inset-0 bg-gray-600 bg-opacity-50 hidden flex items-center justify-center z-50">
        <div class="bg-white rounded-lg shadow-xl p-6 w-full max-w-md">
            <h2 class="text-xl font-bold mb-4">Create New Project</h2>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700">Project Name</label>
                    <input type="text" id="new-project-name" placeholder="e.g. Q4 Audit"
                           class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2">
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-gray-700">Project Title (Description)</label>
                    <input type="text" id="new-project-title" placeholder="e.g. Annual Financial Review"
                           class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2">
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Applied Rate ($/hr)</label>
                        <input type="number" id="new-project-rate" 
                               class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Priority (1-100)</label>
                        <input type="number" id="new-project-priority" min="1" max="100" value="50"
                               class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2">
                    </div>
                </div>
            </div>

            <div class="mt-6 flex justify-end space-x-3">
                <button onclick="toggleProjectModal()" class="text-gray-600 hover:text-gray-800">Cancel</button>
                <button onclick="saveNewProject()" class="bg-indigo-600 text-white px-4 py-2 rounded-md hover:bg-indigo-700">
                    Save Project
                </button>
            </div>
        </div>
    </div>

    <script type="module">
        import { supabase } from './js/config.js';
        import { checkAccess } from './js/auth.js';
        import { renderProjectHeader } from './js/components.js';

        let sessionData = null;

        document.addEventListener('DOMContentLoaded', async () => {
            console.log("?? App Initializing...");
            
            try {
                sessionData = await checkAccess();
                
                if (!sessionData) {
                    console.error("? No session data returned");
                    return; 
                }

                console.log("? Session Loaded for Tenant:", sessionData.tenantId);
                window.sessionData = sessionData;

                const headerElement = document.getElementById('main-header');
                if (headerElement) {
                    renderProjectHeader(sessionData, 'dashboard', 'Project Selection');
                }

                const dashboardTitle = document.querySelector('h1');
                if (dashboardTitle) {
                    dashboardTitle.textContent = `${sessionData.tenantName} - Project Dashboard`;
                }

                await loadProjects();

            } catch (err) {
                console.error("? Init Error:", err);
            }
        });

        async function loadProjects() {
    // 1. Expanded Query to get created_at (for Start Date) and status (for Burn/Balance)
    const { data: projects, error } = await supabase
        .from('projects')
        .select(`
            id, name, title, status, tenant_id, blended_rate, budget_actual,
            requirements (
                id, 
                created_at, 
                totalBudget,
                steps (cost, is_active, status)
            )
        `)
        .eq('tenant_id', sessionData.tenantId);

    if (error) {
        document.getElementById('project-list').innerHTML = `<p class="text-red-500">${error.message}</p>`;
        return;
    }

    renderProjectCards(projects);
}

function renderProjectCards(projects) {
    const projectContainer = document.getElementById('project-list');
    const isAdmin = sessionData.role === 'admin';

    projectContainer.innerHTML = projects.map(project => {
        // A. CALC START DATE: Find earliest requirements.created_at
        const dates = project.requirements?.map(r => new Date(r.created_at)) || [];
        const startDate = dates.length ? new Date(Math.min(...dates)).toLocaleDateString() : 'Not Started';

        // B. CALC ESTIMATED COST: Sum of requirement-level rollups
        const estCost = project.requirements?.reduce((sum, r) => sum + (r.totalBudget || 0), 0) || 0;

        // C. CALC ACTUAL COST & BURN: (Assumes 'Done' tasks = Actual Spend)
        const actualCost = project.requirements?.reduce((acc, req) => {
            const doneSum = req.steps?.filter(s => s.is_active && s.status === 'Done')
                                     .reduce((sum, s) => sum + (s.cost || 0), 0);
            return acc + (doneSum || 0);
        }, 0) || 0;

        const burnPercent = estCost > 0 ? Math.round((actualCost / estCost) * 100) : 0;
        const balance = estCost - actualCost;

        return `
            <div class="bg-white shadow rounded-xl border border-gray-200 overflow-hidden hover:ring-2 hover:ring-indigo-500 transition cursor-pointer" 
                 onclick="openProject('${project.id}', '${project.name}')">
                <div class="p-6">
                    <div class="flex justify-between items-start mb-4">
                        <div>
                            <h3 class="text-xl font-bold text-gray-900">${project.name}</h3>
                            <p class="text-xs text-gray-400 font-medium uppercase tracking-wider">${project.title || 'No Title'}</p>
                        </div>
                        <span class="text-[10px] font-bold px-2 py-1 rounded bg-indigo-50 text-indigo-700 border border-indigo-100">${project.status}</span>
                    </div>

                    <div class="grid grid-cols-2 gap-4 mb-6">
                        <div>
                            <p class="text-[10px] text-gray-400 uppercase font-bold">Start Date</p>
                            <p class="text-sm font-semibold text-gray-700">${startDate}</p>
                        </div>
                        <div class="text-right">
                            <p class="text-[10px] text-gray-400 uppercase font-bold">Burn Rate</p>
                            <p class="text-sm font-bold text-orange-600">${burnPercent}%</p>
                        </div>
                    </div>

                    <div class="space-y-3">
                        <div class="flex justify-between items-end">
                            <span class="text-xs text-gray-500">Estimated</span>
                            <span class="font-mono font-bold text-gray-900">$${estCost.toLocaleString()}</span>
                        </div>
                        <div class="flex justify-between items-end">
                            <span class="text-xs text-gray-500">Actual (Burned)</span>
                            <span class="font-mono font-bold text-red-600">$${actualCost.toLocaleString()}</span>
                        </div>
                        <div class="pt-2 border-t flex justify-between items-end">
                            <span class="text-xs font-bold text-gray-400 uppercase">Balance Remaining</span>
                            <span class="font-mono font-bold text-green-600">$${balance.toLocaleString()}</span>
                        </div>
                    </div>

                    ${isAdmin ? `
                        <button onclick="event.stopPropagation(); openInviteModal('${project.tenant_id}')" 
                                class="mt-6 w-full py-2 text-[10px] font-black text-indigo-600 border border-dashed border-indigo-200 rounded-lg hover:bg-indigo-50 transition">
                            + MANAGE TEAM
                        </button>
                    ` : ''}
                </div>
                <div class="h-1 bg-gray-100 w-full">
                    <div class="h-1 bg-indigo-500" style="width: ${burnPercent}%"></div>
                </div>
            </div>`;
    }).join('');
}

        window.toggleProjectModal = () => {
            const modal = document.getElementById('project-modal');
            if (!modal) return;
            modal.classList.toggle('hidden');

            if (!modal.classList.contains('hidden')) {
                const rateInput = document.getElementById('new-project-rate');
                if (rateInput && window.sessionData) {
                    rateInput.value = window.sessionData.hourlyRate || 0;
                }
            }
        };

        window.openProject = (id, name) => {
            localStorage.setItem('selected_project_id', id);
            localStorage.setItem('selected_project_name', name);
            window.location.href = 'requirements.html';
        };

        window.saveNewProject = async () => {
            try {
                const name = document.getElementById('new-project-name').value.trim();
                const title = document.getElementById('new-project-title').value.trim();
                const rate = parseFloat(document.getElementById('new-project-rate').value) || 0;
                const priority = parseInt(document.getElementById('new-project-priority').value) || 50;

                if (!name || !title) return alert("Please fill in Name and Title.");

                const { error } = await supabase.from('projects').insert([{
                    name: name,
                    title: title,
                    tenant_id: sessionData.tenantId,
                    blended_rate: rate,
                    status: 'Active',
                    priority_value: priority 
                }]);

                if (error) throw error;

                window.toggleProjectModal();
                await loadProjects();
                
                document.getElementById('new-project-name').value = '';
                document.getElementById('new-project-title').value = '';

            } catch (err) {
                console.error("Save Error:", err);
                alert("Save failed: " + err.message);
            }
        };
	// ... existing loadProjects and renderProjectCards functions ...

/**
 * GLOBAL FUNCTIONS
 * We attach these to 'window' so the HTML onclick handlers can find them.
 **/
window.openInviteModal = async (targetTenantId) => {
    // 1. Collect Data
    const email = prompt("Enter email:");
    if (!email) return;

    const fullName = prompt("Enter full name:");
    const hourlyCost = prompt("Enter hourly rate (0 for project default):", "0");
    const role = prompt("Enter role (admin or member):", "member");

    // 2. Insert into Supabase
    const { error } = await supabase
        .from('user_profiles')
        .insert([{
            email: email,
            full_name: fullName,
            hourly_cost: parseFloat(hourlyCost) || 0,
            role: role ? role.toLowerCase() : 'member',
            tenant_id: targetTenantId 
        }]);

    // 3. Handle Result
    if (error) {
        console.error("Invite Error:", error.message);
        alert("Error: " + error.message);
    } else {
        alert(`${fullName} added successfully.`);
        
        /* 4. DATA REFRESH (Optional but recommended)
           If you are on a page that lists users, you'd call your 
           fetch function here so the new name shows up instantly.
        */
        if (typeof loadProjects === 'function') loadProjects();
    }
};
    </script>
</body>
</html>
